<!DOCTYPE html>
                            <html lang="en">

                            <head>
                                <meta charset="utf-8" />
                                <meta content="width=device-width, initial-scale=1.0" name="viewport" />
                                <title>
                                    Countdown Timer
                                </title>
                                <link href="https://fonts.googleapis.com/css2?family=Ovo&amp;display=swap" rel="stylesheet" />
                                <style>
                                    * {
                                        box-sizing: border-box;
                                        margin: 0;
                                        padding: 0;
                                    }

                                    body {
                                        background: transparent;
                                    }

                                    #countdownContainer {
                                        display: flex;
                                        justify-content: center;
                                        align-items: center;
                                        gap: 6px;
                                        margin: 80px 20px;
                                    }

                                    .time-block {
                                        text-align: center;
                                    }

                                    .number-wrap {
                                        overflow: hidden;
                                        height: 56px;
                                        display: flex;
                                        align-items: center;
                                        justify-content: center;
                                    }

                                    .number {
                                        font-size: 45px;
                                        font-family: 'Ovo', serif;
                                        line-height: 1.2;
                                        display: block;
                                        white-space: nowrap;
                                        background: linear-gradient(105deg, #B48C3D 0%, #B48C3D 25%, #cda95a 46%, #d8ba72 52%, #cda95a 58%, #B48C3D 75%, #B48C3D 100%);
                                        background-size: 300% 100%;
                                        -webkit-background-clip: text;
                                        -webkit-text-fill-color: transparent;
                                        background-clip: text;
                                        clip-path: inset(0 100% 0 0);
                                        transition: transform 0.55s cubic-bezier(0.25, 0.1, 0.25, 1), opacity 0.55s ease;
                                    }

                                    .number.revealed {
                                        animation: inkReveal 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards, candleShimmer 4.5s ease-in-out 1.1s infinite;
                                    }

                                    #tb-days .number.revealed {
                                        animation-delay: 0s, 1.1s;
                                    }

                                    #tb-hours .number.revealed {
                                        animation-delay: 0.18s, 1.28s;
                                    }

                                    #tb-mins .number.revealed {
                                        animation-delay: 0.36s, 1.46s;
                                    }

                                    #tb-secs .number.revealed {
                                        animation-delay: 0.54s, 1.64s;
                                    }

                                    @keyframes inkReveal {
                                        0% {
                                            clip-path: inset(0 100% 0 0);
                                        }

                                        100% {
                                            clip-path: inset(0 0% 0 0);
                                        }
                                    }

                                    @keyframes candleShimmer {
                                        0% {
                                            background-position: 100% 0;
                                        }

                                        50% {
                                            background-position: 0% 0;
                                        }

                                        100% {
                                            background-position: 100% 0;
                                        }
                                    }

                                    .number.flip-out {
                                        transform: translateY(-60%);
                                        opacity: 0;
                                    }

                                    .number.flip-in {
                                        transform: translateY(60%);
                                        opacity: 0;
                                        transition: none;
                                    }

                                    .label {
                                        font-size: 19px;
                                        margin-top: 8px;
                                        font-weight: 400;
                                        color: #B48C3D;
                                        font-family: 'Ovo', serif;
                                        opacity: 0;
                                        transition: opacity 0.8s ease;
                                    }

                                    .label.revealed {
                                        opacity: 0.85;
                                    }

                                    #tb-days .label.revealed {
                                        transition-delay: 0.9s;
                                    }

                                    #tb-hours .label.revealed {
                                        transition-delay: 1.08s;
                                    }

                                    #tb-mins .label.revealed {
                                        transition-delay: 1.26s;
                                    }

                                    #tb-secs .label.revealed {
                                        transition-delay: 1.44s;
                                    }

                                    .separator {
                                        font-size: 52px;
                                        margin-top: -40px;
                                        color: #B48C3D;
                                        line-height: 1;
                                        font-family: 'Ovo', serif;
                                        opacity: 0;
                                        transition: opacity 0.6s ease;
                                    }

                                    .separator.revealed {
                                        opacity: 0.9;
                                    }

                                    .sep1.revealed {
                                        transition-delay: 0.25s;
                                    }

                                    .sep2.revealed {
                                        transition-delay: 0.43s;
                                    }

                                    .sep3.revealed {
                                        transition-delay: 0.61s;
                                    }
                                </style>
                            </head>

                            <body>
                                <div id="countdownContainer">
                                    <div class="time-block" id="tb-days">
                                        <div class="number-wrap">
                                            <div class="number" id="days">
                                                168
                                            </div>
                                        </div>
                                        <div class="label">
                                            Days
                                        </div>
                                    </div>
                                    <div class="separator sep1">
                                        :
                                    </div>
                                    <div class="time-block" id="tb-hours">
                                        <div class="number-wrap">
                                            <div class="number" id="hours">
                                                00
                                            </div>
                                        </div>
                                        <div class="label">
                                            Hours
                                        </div>
                                    </div>
                                    <div class="separator sep2">
                                        :
                                    </div>
                                    <div class="time-block" id="tb-mins">
                                        <div class="number-wrap">
                                            <div class="number" id="minutes">
                                                00
                                            </div>
                                        </div>
                                        <div class="label">
                                            Minutes
                                        </div>
                                    </div>
                                    <div class="separator sep3">
                                        :
                                    </div>
                                    <div class="time-block" id="tb-secs">
                                        <div class="number-wrap">
                                            <div class="number" id="seconds">
                                                00
                                            </div>
                                        </div>
                                        <div class="label">
                                            Seconds
                                        </div>
                                    </div>
                                </div>
                            </body>

                            <script>
                                (function () {
                                    var eventDate = new Date(2026, 10, 27, 9, 0, 0);
                                    console.log('eventDate', eventDate);
                                    var elDays = document.getElementById('days');
                                    var elHours = document.getElementById('hours');
                                    var elMins = document.getElementById('minutes');
                                    var elSecs = document.getElementById('seconds');
                                    var prev = {
                                        days: null,
                                        hours: null,
                                        minutes: null,
                                        seconds: null
                                    };
                                    var revealed = false;

                                    function flip(el, newVal) {
                                        if (el.textContent === newVal) return;
                                        el.classList.add('flip-out');
                                        setTimeout(function () {
                                            el.classList.remove('flip-out');
                                            el.classList.add('flip-in');
                                            el.textContent = newVal;
                                            el.offsetHeight;
                                            el.classList.remove('flip-in');
                                        }, 520);
                                    }

                                    function tick() {
                                        var now = new Date();
                                        var dist = eventDate - now;
                                        if (dist < 0) {
                                            document.getElementById('countdownContainer').innerHTML = 'See you there!';
                                            return;
                                        }
                                        var d = String(Math.floor(dist / 86400000));
                                        var h = String(Math.floor((dist % 86400000) / 3600000)).padStart(2, '0');
                                        var m = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
                                        var s = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
                                        if (d !== prev.days) {
                                            flip(elDays, d);
                                            prev.days = d;
                                        };
                                        if (h !== prev.hours) {
                                            flip(elHours, h);
                                            prev.hours = h;
                                        };
                                        if (m !== prev.minutes) {
                                            flip(elMins, m);
                                            prev.minutes = m;
                                        };
                                        if (s !== prev.seconds) {
                                            flip(elSecs, s);
                                            prev.seconds = s;
                                        }
                                    }
                                    tick();
                                    setInterval(tick, 1000);

                                    function doReveal() {
                                        if (revealed) return;
                                        revealed = true;
                                        document.querySelectorAll('.number').forEach(function (el) {
                                            el.classList.add('revealed');
                                        });
                                        document.querySelectorAll('.label').forEach(function (el) {
                                            el.classList.add('revealed');
                                        });
                                        document.querySelectorAll('.separator').forEach(function (el) {
                                            el.classList.add('revealed');
                                        });
                                    }
                                    var observer = new IntersectionObserver(function (entries) {
                                        if (entries[0].isIntersecting) {
                                            doReveal();
                                            observer.disconnect();
                                        }
                                    }, {
                                        threshold: 0.4
                                    });
                                    observer.observe(document.getElementById('countdownContainer'));
                                    setTimeout(function () {
                                        var r = document.getElementById('countdownContainer').getBoundingClientRect();
                                        if (r.top < window.innerHeight && r.bottom > 0) doReveal();
                                    }, 200);

                                    window.addEventListener('load', function () {
                                        window.scrollTo(0, 0);
                                    });
                                })();
                            </script>
